name: Xodium CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1

      - id: setup_java
        name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin

      - id: setup_gradle
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - id: run_ktlint
        name: Run ktlint
        run: ./gradlew ktlintCheck

  build:
    name: Build
    needs: [lint]
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: setup_java
        name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: temurin

      - id: setup_gradle
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - id: build
        name: Build Mod
        run: ./gradlew build

      - id: upload_artifact
        name: Upload Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: RandomBlockPlacement
          path: build/libs/*.jar

  release:
    name: Release
    needs: [build]
    if: github.ref == 'refs/heads/main'
    concurrency: nightly-release
    runs-on: ubuntu-latest
    environment:
      name: "${{ github.ref_name }}"
      url: "${{ steps.create_release.outputs.url }}"
    permissions:
      contents: write
    steps:
      - id: download_artifact
        name: Download RandomBlockPlacement Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: RandomBlockPlacement
          path: dist/

      - id: update_nightly_tag
        name: Update Nightly Tag
        run: |
          gh api repos/${{ github.repository }}/git/refs/tags/nightly \
            --method PATCH --field sha=${{ github.sha }} --field force=true 2>/dev/null || \
          gh api repos/${{ github.repository }}/git/refs \
            --method POST --field ref=refs/tags/nightly --field sha=${{ github.sha }}
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - id: create_release
        name: Create Nightly Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          prerelease: true
          files: dist/*
          tag_name: nightly
          name: Nightly Build
